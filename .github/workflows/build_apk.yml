name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto Repair Android Scaffolding & Inject Firebase
        run: |
          flutter create . --platforms=android --org=com.example
          # Inject Google Services classpath into project build.gradle
          sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          # Apply Google Services plugin at the end of app build.gradle
          echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle

      - name: Auto Increment Version
        run: |
          BUILD_NUM=$(date +%s)
          sed -i "s/version: .*/version: 1.0.$BUILD_NUM+$BUILD_NUM/" pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build Optimized Release APK
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk PaisaLoots.apk

      - name: Create Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PaisaLoots App Build #${{ github.run_number }}
          files: PaisaLoots.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
